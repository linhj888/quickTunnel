name: Build Desktop Apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            platform: darwin-arm64
            pretty: macOS-arm64
            sep: ":"
          - os: windows-latest    # Windows x64
            platform: windows-amd64
            pretty: Windows-x64
            sep: ";"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install customtkinter pyinstaller

      - name: Keep only this platform's kernel package
        shell: bash
        run: find pkg -name "cloudflared-*.xz" ! -name "cloudflared-${{ matrix.platform }}.xz" -delete

      - name: Build with PyInstaller
        shell: bash
        run: >
          pyinstaller --windowed --noconfirm --name QuickTunnel
          --collect-all customtkinter
          --add-data "pkg${{ matrix.sep }}pkg"
          main.py

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dmgstage
          cp -R dist/QuickTunnel.app dmgstage/
          ln -s /Applications dmgstage/Applications
          hdiutil create -volname QuickTunnel -srcfolder dmgstage -ov -format UDZO -o "dist/QuickTunnel-${{ github.ref_name }}-${{ matrix.pretty }}.dmg"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          python -c "import shutil; shutil.make_archive('dist/QuickTunnel-${{ github.ref_name }}-${{ matrix.pretty }}', 'zip', 'dist', 'QuickTunnel')"

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --title "QuickTunnel ${{ github.ref_name }}" --notes "See README for usage. Each package bundles only its own platform's kernel." || true

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/QuickTunnel-*.dmg dist/QuickTunnel-*.zip --clobber
